    TaskCompletion:
      type: object
      description: |-
        A routine item ticked off for a day.

        `id` is declared explicitly for the same reason DailyRecordSerializer
        does it: ModelSerializer forces a primary-key field to read_only, which
        would discard the client-generated UUID and break offline idempotency.
        A completion has no editable content — it exists or it does not — so
        the only write after creation is the 24-hour-locked delete (un-tick).
      properties:
        id:
          type: string
          format: uuid
        template:
          type: integer
        template_name:
          type: string
          readOnly: true
        suggested_time:
          type: string
          readOnly: true
        house:
          type: integer
        house_name:
          type: string
          readOnly: true
        completion_date:
          type: string
          format: date
        recorded_by:
          type: integer
          readOnly: true
          nullable: true
        recorded_by_name:
          type: string
          readOnly: true
        recorded_at:
          type: string
          format: date-time
          description: Client-supplied. When the worker actually entered this.
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_editable:
          type: boolean
          readOnly: true
      required:
      - completion_date
      - created_at
      - house
      - house_name
      - is_editable
      - recorded_by
      - recorded_by_name
      - suggested_time
      - template
      - template_name
