  /api/farms/{farm_pk}/tasks/completions/:
    get:
      operationId: farms_tasks_completions_list
      description: |-
        GET  /api/farms/<farm_pk>/tasks/completions/?date=YYYY-MM-DD  — defaults to today
        POST /api/farms/<farm_pk>/tasks/completions/                  — workers included

        Idempotent, mirroring InventoryUsageListCreateView: a POST whose
        client-generated `id` already exists routes through the serializer's
        update() and returns 200. Unlike the daily-record path, a POST whose
        id is new but whose (template, date, house) is already taken is
        ABSORBED — the existing completion is returned with a 200 — because a
        completion has no content to merge and a shed's routine item is simply
        done.

        A worker may only tick for a house they may write to
        (FarmMembership.may_write_to_house — the same rule as daily records).
        That check is here on the single-POST path; the bulk-sync serializer
        does it per record so a lost assignment lands in failed[] instead of
        403-ing the whole backlog.
      parameters:
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskCompletion'
          description: ''
    post:
      operationId: farms_tasks_completions_create
      description: |-
        GET  /api/farms/<farm_pk>/tasks/completions/?date=YYYY-MM-DD  — defaults to today
        POST /api/farms/<farm_pk>/tasks/completions/                  — workers included

        Idempotent, mirroring InventoryUsageListCreateView: a POST whose
        client-generated `id` already exists routes through the serializer's
        update() and returns 200. Unlike the daily-record path, a POST whose
        id is new but whose (template, date, house) is already taken is
        ABSORBED — the existing completion is returned with a 200 — because a
        completion has no content to merge and a shed's routine item is simply
        done.

        A worker may only tick for a house they may write to
        (FarmMembership.may_write_to_house — the same rule as daily records).
        That check is here on the single-POST path; the bulk-sync serializer
        does it per record so a lost assignment lands in failed[] instead of
        403-ing the whole backlog.
      parameters:
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCompletionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskCompletionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskCompletionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCompletion'
          description: ''
  /api/farms/{farm_pk}/tasks/completions/{id}/:
    get:
      operationId: farms_tasks_completions_retrieve
      description: |-
        GET / DELETE /api/farms/<farm_pk>/tasks/completions/<pk>/

        DELETE is the un-tick. Subject to the same 24-hour rule as editing any
        field record: a worker who ticks the wrong item can undo it within the
        day, after which it is locked and the response is a clean 400.
      parameters:
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCompletion'
          description: ''
    delete:
      operationId: farms_tasks_completions_destroy
      description: |-
        GET / DELETE /api/farms/<farm_pk>/tasks/completions/<pk>/

        DELETE is the un-tick. Subject to the same 24-hour rule as editing any
        field record: a worker who ticks the wrong item can undo it within the
        day, after which it is locked and the response is a clean 400.
      parameters:
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
