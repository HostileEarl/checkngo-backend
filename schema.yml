components:
  schemas:
    AccountRoleEnum:
      enum:
      - OWNER
      - MANAGER
      - WORKER
      - SUPPLIER
      - CONSUMER
      type: string
      description: |-
        * `OWNER` - Farm Owner
        * `MANAGER` - Farm Manager
        * `WORKER` - Farm Worker
        * `SUPPLIER` - Supplier
        * `CONSUMER` - Consumer
    Batch:
      type: object
      description: Read view. All derived metrics are computed, never stored.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        house:
          type: integer
        house_name:
          type: string
          readOnly: true
        batch_code:
          type: string
          description: Human-facing, e.g. B-2026-03
          maxLength: 50
        breed:
          type: string
          maxLength: 100
        initial_bird_count:
          type: integer
          maximum: 2147483647
          minimum: 1
        current_bird_count:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        expected_harvest_date:
          type: string
          format: date
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/BatchStatusEnum'
          readOnly: true
        termination_reason:
          type: string
          readOnly: true
        terminated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        terminated_by_name:
          type: string
          readOnly: true
        total_mortality:
          type: integer
          readOnly: true
        total_feed_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        mortality_rate:
          type: string
          readOnly: true
        feed_conversion_ratio:
          type: string
          nullable: true
          readOnly: true
        age_days:
          type: integer
          readOnly: true
        latest_weight_grams:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - age_days
      - batch_code
      - created_at
      - current_bird_count
      - feed_conversion_ratio
      - house
      - house_name
      - id
      - initial_bird_count
      - latest_weight_grams
      - mortality_rate
      - start_date
      - status
      - terminated_at
      - terminated_by_name
      - termination_reason
      - total_feed_kg
      - total_mortality
    BatchCreate:
      type: object
      description: |-
        Placement of a new cohort. Owner/manager only — bird counts and
        expected revenue are business decisions, not data entry.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        house:
          type: integer
        batch_code:
          type: string
          description: Human-facing, e.g. B-2026-03
          maxLength: 50
        breed:
          type: string
          maxLength: 100
        initial_bird_count:
          type: integer
          maximum: 2147483647
          minimum: 1
        start_date:
          type: string
          format: date
        expected_harvest_date:
          type: string
          format: date
          nullable: true
      required:
      - batch_code
      - house
      - id
      - initial_bird_count
      - start_date
    BatchCreateRequest:
      type: object
      description: |-
        Placement of a new cohort. Owner/manager only — bird counts and
        expected revenue are business decisions, not data entry.
      properties:
        house:
          type: integer
        batch_code:
          type: string
          minLength: 1
          description: Human-facing, e.g. B-2026-03
          maxLength: 50
        breed:
          type: string
          maxLength: 100
        initial_bird_count:
          type: integer
          maximum: 2147483647
          minimum: 1
        start_date:
          type: string
          format: date
        expected_harvest_date:
          type: string
          format: date
          nullable: true
      required:
      - batch_code
      - house
      - initial_bird_count
      - start_date
    BatchStatusEnum:
      enum:
      - ACTIVE
      - HARVESTED
      - TERMINATED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `HARVESTED` - Harvested
        * `TERMINATED` - Terminated
    DailyRecord:
      type: object
      description: |-
        One entry per batch per day.

        The UUID primary key is client-supplied so an offline device can generate
        it before syncing — that is what makes a retry idempotent rather than
        duplicating the day's data.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        batch:
          type: string
          format: uuid
          readOnly: true
        record_date:
          type: string
          format: date
        mortality:
          type: integer
          readOnly: true
        mortality_disease:
          type: integer
          maximum: 2147483647
          minimum: 0
        mortality_heat:
          type: integer
          maximum: 2147483647
          minimum: 0
        mortality_culled:
          type: integer
          maximum: 2147483647
          minimum: 0
        mortality_unknown:
          type: integer
          maximum: 2147483647
          minimum: 0
        feed_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        notes:
