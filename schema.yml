      description: |-
        GET  /api/farms/<farm_pk>/batches/<batch_pk>/daily-records/
        POST /api/farms/<farm_pk>/batches/<batch_pk>/daily-records/

        The worker's primary write path.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      requestBody:
