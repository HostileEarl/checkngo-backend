          format: uuid
          readOnly: true
        batch:
          type: string
          format: uuid
          readOnly: true
        batch_code:
          type: string
          readOnly: true
        record_date:
          type: string
          format: date
          readOnly: true
        target_type:
          type: string
          readOnly: true
        object_id:
          type: string
          format: uuid
          readOnly: true
        previous_values:
          readOnly: true
          description: Full snapshot before the change.
        new_values:
          readOnly: true
        changed_fields:
          readOnly: true
        reason:
          type: string
          readOnly: true
        corrected_by_name:
          type: string
          readOnly: true
        corrected_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - batch
      - batch_code
      - changed_fields
      - corrected_at
      - corrected_by_name
      - id
      - new_values
      - object_id
      - previous_values
      - reason
      - record_date
      - target_type
    RoleEnum:
      enum:
      - OWNER
      - MANAGER
      - WORKER
      type: string
      description: |-
        * `OWNER` - Farm Owner
        * `MANAGER` - Farm Manager
        * `WORKER` - Farm Worker
    SaleEvent:
      type: object
      description: |-
        One transaction in which some of a batch's birds left.

        Same offline shape as DailyRecordSerializer: the UUID primary key is
        client-supplied so a retry is idempotent, and an edit outside the
        24-hour window is refused. Identity is the UUID alone — there is no
        per-day uniqueness, several sales happen in a day.
      properties:
        id:
          type: string
          format: uuid
        batch:
          type: string
          format: uuid
          readOnly: true
        sale_date:
          type: string
          format: date
        sale_type:
          $ref: '#/components/schemas/SaleTypeEnum'
        bird_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        part_name:
          type: string
          maxLength: 60
        total_weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        price_per_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Price per kilogram. Revenue is derived from this x total_weight_kg.
        revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Sale value. Derived from price_per_kg; null only on legacy
            rows.
        buyer_link:
          type: integer
          nullable: true
          description: Optional per-sale buyer.
        buyer_name:
          type: string
          maxLength: 100
        buyer_display:
          type: string
          description: |-
            The buyer column's single source of truth: a registered buyer's
            business name or personal name, else the free-text walk-in name,
            else "Walk-in". Falls back further, same as the sales-history
            report (see analytics.reports.sales_history_rows), to the batch's
            legacy Harvest-wide buyer when NO sale on this batch has ever
            carried its own buyer_link — the pre-per-sale-buyer behaviour,
            preserved for batches closed before this field existed.
          readOnly: true
        notes:
          type: string
          maxLength: 255
        average_weight_kg:
          type: string
          nullable: true
          readOnly: true
        revenue_per_kg:
          type: string
          nullable: true
          readOnly: true
        total_paid:
          type: string
          readOnly: true
        outstanding:
          type: string
          nullable: true
          readOnly: true
        is_fully_paid:
          type: boolean
          readOnly: true
        recorded_by:
          type: integer
          readOnly: true
          nullable: true
        recorded_by_name:
          type: string
          readOnly: true
        recorded_at:
          type: string
          format: date-time
          description: Client-supplied. When the worker actually entered this.
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_editable:
          type: boolean
          readOnly: true
        sync_delay_seconds:
          type: number
          format: double
          readOnly: true
      required:
      - average_weight_kg
      - batch
      - buyer_display
      - created_at
      - is_editable
      - is_fully_paid
      - outstanding
      - recorded_by
      - recorded_by_name
      - revenue
      - revenue_per_kg
      - sale_date
      - sale_type
      - sync_delay_seconds
      - total_paid
      - total_weight_kg
    SaleEventBulkSyncRequest:
      type: object
      description: |-
        Offline sync for sale events — a yard's backlog in one round trip.

        Identity is purely the client UUID (a sale is an event, not a
        one-per-day record), so this is the InventoryUsageLog pattern, not the
        DailyRecord one: no (batch, date) fallback and no same-date conflict.
        Each row is written in its own savepoint; one bad row does not reject
        the rest.
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SaleEventRequest'
      required:
      - records
