          application/json:
            schema:
              $ref: '#/components/schemas/DailyRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DailyRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DailyRecordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecord'
          description: ''
  /api/farms/{farm_pk}/batches/{batch_pk}/daily-records/{id}/:
    get:
      operationId: farms_batches_daily_records_retrieve
      description: |-
        GET / PATCH /api/farms/<farm_pk>/batches/<batch_pk>/daily-records/<pk>/

        PATCH is refused by the serializer once the 24-hour window closes.
        No DELETE — a recorded day is not removable.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecord'
          description: ''
    put:
      operationId: farms_batches_daily_records_update
      description: |-
        GET / PATCH /api/farms/<farm_pk>/batches/<batch_pk>/daily-records/<pk>/

        PATCH is refused by the serializer once the 24-hour window closes.
        No DELETE — a recorded day is not removable.
      parameters:
