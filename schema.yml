    InventoryUsageBulkSyncRequest:
      type: object
      description: |-
        Offline sync for usage logs — a backlog of events in one round trip.

        Simpler than the daily-record equivalent: identity is purely the
        client UUID, so there is no (batch, date) fallback and no
        same-date-different-id conflict to resolve. Each record is written in
        its own savepoint; one bad row does not reject the rest.
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/InventoryUsageLogRequest'
      required:
      - records
    InventoryUsageLog:
      type: object
      description: |-
        One worker drawing an item down.

        `id` is declared explicitly for the same reason DailyRecordSerializer
        does it: ModelSerializer forces a primary-key field to read_only, which
        would discard the client-generated UUID and break idempotency. The
        identity of a usage log is that UUID alone — it is an event, not a
        one-per-day record, so there is no date fallback and a worker may log
        the same item any number of times in a day.
      properties:
        id:
          type: string
          format: uuid
        item:
          type: integer
        item_name:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
        quantity_used:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        usage_date:
          type: string
          format: date
        notes:
          type: string
          maxLength: 255
        recorded_by:
          type: integer
          readOnly: true
          nullable: true
        recorded_by_name:
          type: string
          readOnly: true
        recorded_at:
          type: string
          format: date-time
          description: Client-supplied. When the worker actually entered this.
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_editable:
          type: boolean
          readOnly: true
        sync_delay_seconds:
          type: number
          format: double
          readOnly: true
        source:
          type: string
          readOnly: true
        daily_record:
          type: string
          format: uuid
          readOnly: true
        batch_code:
          type: string
          readOnly: true
        house_name:
