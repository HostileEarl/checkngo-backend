      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        source:
          type: string
          readOnly: true
        harvest_date:
          type: string
          format: date
          readOnly: true
        farm:
          type: integer
          readOnly: true
        farm_name:
          type: string
          readOnly: true
        batch_code:
          type: string
          readOnly: true
        birds_harvested:
          type: integer
          readOnly: true
        total_weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        average_weight_kg:
          type: string
          nullable: true
          readOnly: true
        sale_type:
