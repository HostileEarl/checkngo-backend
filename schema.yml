    BuyerPayment:
      type: object
      description: |-
        A buyer's read-only view of one payment they made against a sale.

        This is the buyer's own record of money they paid — not a figure the
        farm entered about them — so, unlike BuyerPurchaseSerializer, there is
        no dispute risk in showing it back. What stays withheld is the sale's
        side of the ledger: no revenue, no outstanding balance, no other
        buyer's payments, nothing about mortality, feed, or FCR.
      properties:
        id:
          type: integer
          readOnly: true
        farm:
          type: integer
          readOnly: true
        farm_name:
          type: string
          readOnly: true
        batch_code:
          type: string
          readOnly: true
        sale_date:
          type: string
          format: date
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        received_date:
          type: string
          format: date
          readOnly: true
          description: The day the payment was received.
        is_reversal:
          type: boolean
          readOnly: true
      required:
      - amount
      - batch_code
      - farm
      - farm_name
      - id
      - is_reversal
      - received_date
      - sale_date
    BuyerPurchase:
      type: object
      description: |-
        A buyer's read-only view of one harvest a farm sold them: what arrived
        and how much it weighed.

        Revenue and revenue_per_kg are deliberately withheld. Revenue is the
        FARM'S figure — entered by the farm after the sale — and showing it back
        to the buyer means showing them what the farm recorded them as paying,
        which may not match their own books. This endpoint is a delivery and
        weight ledger, not an invoice; surfacing revenue here would manufacture
        disputes the system has no business creating.

        Also withheld: `notes` and `recorded_by` (the farm's internal
        annotations), and anything about mortality, feed, or FCR (production
        performance is the farm's business, not the buyer's).
      properties:
        id:
          type: integer
          readOnly: true
        source:
          type: string
          readOnly: true
        harvest_date:
          type: string
          format: date
          readOnly: true
        farm:
          type: integer
          readOnly: true
        farm_name:
          type: string
          readOnly: true
        batch_code:
          type: string
          readOnly: true
        birds_harvested:
          type: integer
          readOnly: true
          nullable: true
        total_weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        average_weight_kg:
          type: string
          nullable: true
          readOnly: true
      required:
      - average_weight_kg
      - batch_code
      - birds_harvested
      - farm
      - farm_name
      - harvest_date
      - id
      - source
      - total_weight_kg
    BuyerPurchaseRow:
      oneOf:
      - $ref: '#/components/schemas/BuyerPurchase'
      - $ref: '#/components/schemas/BuyerSalePurchase'
      discriminator:
        propertyName: source
        mapping:
          harvest: '#/components/schemas/BuyerPurchase'
          sale: '#/components/schemas/BuyerSalePurchase'
    BuyerSalePurchase:
