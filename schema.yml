        **Idempotent.** Supply the client-generated UUID as `id`. Re-syncing an event that already exists overwrites it, provided it is still inside the 24-hour window.

        **An event, not a daily record.** The same item may appear more than once — each row is its own event, keyed only by `id`. There is no per-day uniqueness.

