        part_name:
          type: string
          maxLength: 60
        total_weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        price_per_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Price per kilogram. Revenue is derived from this x total_weight_kg.
        buyer_link:
          type: integer
          nullable: true
          description: Optional per-sale buyer.
        buyer_name:
          type: string
