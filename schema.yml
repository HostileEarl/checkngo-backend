openapi: 3.0.3
info:
  title: CheckN Go API
  version: 1.0.0
  description: |-
    Backend for CheckN Go — a cross-platform poultry management system for distributed farm coordination and descriptive analytics.

    **Authentication:** phone number (E.164) + PIN, returning JWT access and refresh tokens. Send `Authorization: Bearer <access>`.

    **Forced rotation:** a newly onboarded user has `must_change_credential = true` and is blocked from every endpoint except `/auth/me/` and `/auth/credential/change/` until they rotate their PIN.

    **Farm scoping:** operational endpoints are nested under `/farms/<farm_id>/`. Access is resolved from the caller's active membership on that farm; a member of one farm cannot read another's data.
paths:
  /api/auth/credential/change/:
    post:
      operationId: auth_credential_change_create
      description: |-
        POST /api/auth/credential/change/

        The only way through the rotation gate, so it must stay reachable by
        gated users. Throttled because it verifies the current PIN.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        POST /api/auth/login/

        Two throttle layers: per-phone stops brute-forcing one account,
        per-IP stops spraying one PIN across many accounts.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhonePinTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhonePinTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhonePinTokenRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: POST /api/auth/logout/ — revoke a single device's refresh token.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        GET /api/auth/me/ — current user plus farm scope.

        Memberships are included because the client needs to know which farms
        it may address before it can call any farm-scoped endpoint. Without
        them a restored session knows who it is but not where it works.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/verify/:
    post:
      operationId: auth_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/farms/:
    get:
      operationId: farms_list
      description: |-
        GET  /api/farms/ — farms this user belongs to, archived ones included
        POST /api/farms/ — create a farm; the signal grants OWNER membership
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Farm'
          description: ''
    post:
      operationId: farms_create
      description: |-
        GET  /api/farms/ — farms this user belongs to, archived ones included
        POST /api/farms/ — create a farm; the signal grants OWNER membership
      tags:
      - farms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FarmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FarmRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farm'
          description: ''
  /api/farms/{farm_pk}/alerts/:
    get:
      operationId: farms_alerts_retrieve
      description: |-
        Standing conditions derived from live data — high mortality, an unbalanced feed ledger, a day not yet recorded, an approaching harvest, an expiring invitation, a recent correction.

        Nothing is persisted. Each alert carries a stable `id` so the client can remember dismissals, and an `audience` — the list is already filtered to the caller's role before it is returned. `link` omits the role prefix; the client prepends it.
      summary: Computed alerts for the notification bell
      parameters:
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/farms/{farm_pk}/analytics/batches/{batch_pk}/growth/:
    get:
      operationId: farms_analytics_batches_growth_retrieve
      description: GET /api/farms/<farm_pk>/analytics/batches/<batch_pk>/growth/
      summary: Growth curve — weight samples over time
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/farms/{farm_pk}/analytics/batches/{batch_pk}/mortality/:
    get:
      operationId: farms_analytics_batches_mortality_retrieve
      description: |-
        Daily deaths for one batch, split by cause, with a running cumulative rate.

        **Gaps are real.** A day with no record is absent from `points` — it is not filled with zero, because 'nobody recorded' is a different claim from 'no birds died'. Render the gap.

        **`was_corrected`** marks days a manager amended after the 24-hour lock. Flag these visually.
      summary: CHART 1 — mortality over time
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/farms/{farm_pk}/analytics/dashboard/:
    get:
      operationId: farms_analytics_dashboard_retrieve
      description: Single call for the landing screen — active batches, bird counts,
        feed balance, and lifetime FCR. Avoids four round trips on mobile.
      summary: Farm dashboard rollup
      parameters:
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/farms/{farm_pk}/analytics/fcr/:
    get:
      operationId: farms_analytics_fcr_retrieve
      description: |-
        FCR = feed consumed (kg) / live weight produced (kg). Lower is better; 1.5–1.8 is typical for well-run broilers.

        **Harvested batches only.** Active batches have no weight denominator and terminated batches never reached a production outcome. The `excluded` block reports how many were left out and why — surface this so the chart never silently under-reports.
      summary: CHART 2 — feed conversion ratio by batch
      parameters:
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/farms/{farm_pk}/analytics/mortality-comparison/:
    get:
      operationId: farms_analytics_mortality_comparison_retrieve
      description: GET /api/farms/<farm_pk>/analytics/mortality-comparison/?status=ACTIVE
      summary: Mortality rates across batches
      parameters:
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      - in: query
        name: status
        schema:
          type: string
        description: 'Filter: ACTIVE, HARVESTED, or TERMINATED.'
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/farms/{farm_pk}/analytics/profitability/:
    get:
      operationId: farms_analytics_profitability_retrieve
      description: |-
        Revenue against apportioned feed cost.

        **This is feed margin, not net profit.** Feed cost is allocated using the farm's average cost per kg — it is not a traced expense. Chicks, labour, utilities, medication, and depreciation are excluded. The `methodology` block in the response states this; display it.

        **`null` is not zero.** A batch with no recorded sale price returns `revenue: null` and `feed_margin: null`. Render as 'not recorded', never as ₱0.
      summary: CHART 3 — feed margin by batch (owner/manager only)
      parameters:
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/farms/{farm_pk}/archive/:
    post:
      operationId: farms_archive_create
      description: POST /api/farms/<farm_pk>/archive/ — close to new data, keep history.
      parameters:
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/farms/{farm_pk}/batches/:
    get:
      operationId: farms_batches_list
      description: |-
        GET  /api/farms/<farm_pk>/batches/?status=ACTIVE&house=<id>
        POST /api/farms/<farm_pk>/batches/  — placement, owner/manager only
      parameters:
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Batch'
          description: ''
    post:
      operationId: farms_batches_create
      description: |-
        GET  /api/farms/<farm_pk>/batches/?status=ACTIVE&house=<id>
        POST /api/farms/<farm_pk>/batches/  — placement, owner/manager only
      parameters:
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreate'
          description: ''
  /api/farms/{farm_pk}/batches/{batch_pk}/close/:
    post:
      operationId: farms_batches_close_create
      description: |-
        POST /api/farms/<farm_pk>/batches/<batch_pk>/close/

        Marks the batch HARVESTED, frees the house, and writes the Harvest
        record with totals summed from every sale event. Takes only
        closing_notes and an optional principal buyer_link. Refuses a batch
        with no sale events.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/farms/{farm_pk}/batches/{batch_pk}/corrections/:
    get:
      operationId: farms_batches_corrections_list
      description: |-
        GET /api/farms/<farm_pk>/batches/<batch_pk>/corrections/

        Readable by every member — a worker should know when their entry was
        overwritten, and by whom.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordCorrection'
          description: ''
  /api/farms/{farm_pk}/batches/{batch_pk}/daily-records/:
    get:
      operationId: farms_batches_daily_records_list
      description: |-
        GET  /api/farms/<farm_pk>/batches/<batch_pk>/daily-records/
        POST /api/farms/<farm_pk>/batches/<batch_pk>/daily-records/

        The worker's primary write path.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyRecord'
          description: ''
    post:
      operationId: farms_batches_daily_records_create
      description: |-
        GET  /api/farms/<farm_pk>/batches/<batch_pk>/daily-records/
        POST /api/farms/<farm_pk>/batches/<batch_pk>/daily-records/

        The worker's primary write path.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DailyRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DailyRecordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecord'
          description: ''
  /api/farms/{farm_pk}/batches/{batch_pk}/daily-records/{id}/:
    get:
      operationId: farms_batches_daily_records_retrieve
      description: |-
        GET / PATCH /api/farms/<farm_pk>/batches/<batch_pk>/daily-records/<pk>/

        PATCH is refused by the serializer once the 24-hour window closes.
        No DELETE — a recorded day is not removable.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecord'
          description: ''
    put:
      operationId: farms_batches_daily_records_update
      description: |-
        GET / PATCH /api/farms/<farm_pk>/batches/<batch_pk>/daily-records/<pk>/

        PATCH is refused by the serializer once the 24-hour window closes.
        No DELETE — a recorded day is not removable.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - farms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DailyRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DailyRecordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecord'
          description: ''
    patch:
      operationId: farms_batches_daily_records_partial_update
      description: |-
        GET / PATCH /api/farms/<farm_pk>/batches/<batch_pk>/daily-records/<pk>/

        PATCH is refused by the serializer once the 24-hour window closes.
        No DELETE — a recorded day is not removable.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - farms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDailyRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDailyRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDailyRecordRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecord'
          description: ''
  /api/farms/{farm_pk}/batches/{batch_pk}/daily-records/{id}/correct/:
    post:
      operationId: farms_batches_daily_records_correct_create
      description: |-
        POST /api/farms/<farm_pk>/batches/<batch_pk>/daily-records/<pk>/correct/

        The legitimate front door around the 24-hour lock. Every use writes a
        permanent, immutable log entry naming who, what, and why.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/farms/{farm_pk}/batches/{batch_pk}/daily-records/bulk-sync/:
    post:
      operationId: farms_batches_daily_records_bulk_sync_create
      description: |-
        Upload a backlog of daily records in one request, for devices returning from a dead zone.

        **Idempotent.** Supply the client-generated UUID as `id`. Re-syncing a day that already exists overwrites it, provided it is still inside the 24-hour window.

        **Partial success is normal.** Each record is written in its own savepoint, so one bad row does not reject the rest. A `207 Multi-Status` means some records failed — read `failed[]` for which and why, and retry only those. `200` means all landed.

        **Limits.** Maximum 60 records per request. Duplicate dates within one payload are rejected outright with a 400.
      summary: Offline bulk sync — daily records
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - Production
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyRecordBulkSyncRequest'
            examples:
              ThreeDaysOfBacklog:
                value:
                  records:
                  - id: 9f1c2e4a-1b3d-4f5a-8c9e-0a1b2c3d4e5f
                    record_date: '2026-08-19'
                    mortality_disease: 4
                    mortality_heat: 0
                    mortality_culled: 2
                    mortality_unknown: 0
                    feed_kg: '312.50'
                    recorded_at: '2026-08-19T06:15:00+08:00'
                summary: Three days of backlog
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DailyRecordBulkSyncRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DailyRecordBulkSyncRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/farms/{farm_pk}/batches/{batch_pk}/harvest/detail/:
    get:
      operationId: farms_batches_harvest_detail_retrieve
      description: GET /api/farms/<farm_pk>/batches/<batch_pk>/harvest/detail/
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Harvest'
          description: ''
  /api/farms/{farm_pk}/batches/{batch_pk}/sales/:
    get:
      operationId: farms_batches_sales_list
      description: |-
        GET  /api/farms/<farm_pk>/batches/<batch_pk>/sales/
        POST /api/farms/<farm_pk>/batches/<batch_pk>/sales/

        Owner and manager write; every member reads. A worker records mortality
        and feed, not sales. Idempotent: a POST whose client-generated `id`
        already exists is a retry, routed through the serializer's update()
        (which enforces the 24-hour lock) and returns 200 — mirroring
        DailyRecordListCreateView. No same-date conflict branch: a sale is an
        event, and several sales in one day are legitimate.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleEvent'
          description: ''
    post:
      operationId: farms_batches_sales_create
      description: |-
        GET  /api/farms/<farm_pk>/batches/<batch_pk>/sales/
        POST /api/farms/<farm_pk>/batches/<batch_pk>/sales/

        Owner and manager write; every member reads. A worker records mortality
        and feed, not sales. Idempotent: a POST whose client-generated `id`
        already exists is a retry, routed through the serializer's update()
        (which enforces the 24-hour lock) and returns 200 — mirroring
        DailyRecordListCreateView. No same-date conflict branch: a sale is an
        event, and several sales in one day are legitimate.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: farm_pk
        schema:
          type: integer
        required: true
      tags:
      - farms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleEventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaleEventRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
