        (`recorded_by`, `recorded_at`) is never writable and never edited.

        A plain payment (no `reverses`) must be positive. A reversal must name
        the exact payment it corrects and carry the exact negative of that
        payment's amount — a partial reversal would leave the ledger implying
        a correction that doesn't fully undo the mistake it names.
      properties:
        id:
          type: integer
          readOnly: true
        sale:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        received_date:
          type: string
          format: date
          description: The day the payment was received.
        note:
          type: string
          maxLength: 255
        buyer_link:
          type: integer
          nullable: true
          description: Who paid, if they are a registered buyer.
        buyer_name:
          type: string
          nullable: true
          readOnly: true
        reverses:
          type: integer
          nullable: true
          description: The payment this row corrects, if this is a reversal.
        recorded_by:
          type: integer
          readOnly: true
          nullable: true
        recorded_by_name:
          type: string
          readOnly: true
        recorded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - buyer_name
      - id
      - received_date
      - recorded_at
      - recorded_by
      - recorded_by_name
      - sale
    PaymentRequest:
      type: object
      description: |-
        Append-only — see the view: no update, no delete. Attribution
        (`recorded_by`, `recorded_at`) is never writable and never edited.

        A plain payment (no `reverses`) must be positive. A reversal must name
        the exact payment it corrects and carry the exact negative of that
        payment's amount — a partial reversal would leave the ledger implying
        a correction that doesn't fully undo the mistake it names.
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        received_date:
          type: string
          format: date
          description: The day the payment was received.
        note:
          type: string
          maxLength: 255
        buyer_link:
          type: integer
          nullable: true
          description: Who paid, if they are a registered buyer.
        reverses:
          type: integer
          nullable: true
          description: The payment this row corrects, if this is a reversal.
      required:
      - amount
      - received_date
    PhonePinTokenRequest:
      type: object
      description: |-
        Login with phone number + PIN.

        SimpleJWT hardcodes 'password' in its parent serializer. We expose 'pin'
        to the client and remap it internally, so the API vocabulary matches the
        domain and the Flutter client never sees the word 'password'.
      properties:
        phone_number:
          type: string
          writeOnly: true
          minLength: 1
        pin:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - phone_number
      - pin
    RecordCorrection:
